<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON OVERDRIVE V: HYPER SPEED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff9d;
            --neon-red: #ff0055;
            --neon-yellow: #ffee00;
            --bg-color: #050510;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh; /* Use dynamic viewport height for mobile browsers */
            user-select: none;
            touch-action: none;
        }

        #game-wrapper {
            position: relative;
            box-shadow: 0 0 80px rgba(0, 243, 255, 0.15);
            border: 2px solid #333;
            background: #000;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 800 / 900;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        canvas {
            display: block;
            background: #0a0a12;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
            z-index: 20;
            overflow-y: auto;
            padding: 20px 0;
        }

        .hidden { opacity: 0; pointer-events: none; }

        h1 {
            font-size: clamp(32px, 8vw, 56px);
            margin: 0 0 5px 0;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        h2 { color: #fff; font-size: 14px; margin-bottom: 15px; opacity: 0.8; letter-spacing: 2px; }

        /* Vehicle Selection Grid */
        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            padding: 0 15px;
            width: 100%;
            box-sizing: border-box;
        }

        @media (max-width: 500px) {
            .vehicle-grid { grid-template-columns: repeat(4, 1fr); }
            .vehicle-card:nth-child(n+9) { display: none; } /* Show only top 8 on very small screens or scroll */
            .vehicle-grid { overflow-x: auto; grid-template-columns: repeat(10, 70px); padding-bottom: 10px; }
        }

        .vehicle-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            padding: 8px 4px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 4px;
            min-width: 60px;
        }

        .vehicle-card:hover, .vehicle-card.selected {
            border-color: var(--neon-green);
            background: rgba(0, 255, 157, 0.15);
            box-shadow: 0 0 15px var(--neon-green);
            transform: translateY(-3px);
        }

        .v-name { font-size: 8px; margin-top: 6px; color: #fff; font-weight: bold; text-transform: uppercase; }

        .btn {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            padding: 12px 40px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: 0.2s;
            font-weight: bold;
            margin-top: 15px;
        }

        .btn:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 30px var(--neon-pink);
        }

        .btn-small {
            font-size: 10px;
            padding: 6px 12px;
            border: 1px solid #555;
            color: #aaa;
            margin-top: 8px;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }
        
        .hud-panel {
            background: rgba(0,0,0,0.7);
            border-left: 3px solid var(--neon-blue);
            padding: 8px 15px;
            font-size: 14px;
            text-shadow: 0 0 5px var(--neon-blue);
            clip-path: polygon(0 0, 100% 0, 100% 80%, 90% 100%, 0 100%);
        }

        .right-panel {
            border-left: none;
            border-right: 3px solid var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
            text-align: right;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 10% 100%, 0 80%);
        }
        
        /* Nitro Bar */
        #nitro-container {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 300px;
            height: 8px;
            background: #222;
            border: 1px solid #555;
            border-radius: 4px;
            z-index: 10;
            display: none;
        }
        #nitro-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00f3ff, #0055ff);
            box-shadow: 0 0 10px #00f3ff;
        }
        #nitro-label {
            position: absolute;
            top: -12px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 9px;
            color: var(--neon-blue);
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 120px;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 15;
            pointer-events: none;
        }

        .touch-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 243, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            color: rgba(0, 243, 255, 0.5);
            font-size: 24px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .touch-btn:active {
            background: rgba(0, 243, 255, 0.2);
            border-color: var(--neon-blue);
            color: #fff;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .nitro-btn {
            border-color: rgba(255, 0, 255, 0.3);
            color: rgba(255, 0, 255, 0.5);
            width: 80px;
            height: 80px;
        }

        .nitro-btn:active {
            background: rgba(255, 0, 255, 0.2);
            border-color: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 20px var(--neon-pink);
        }

        /* Show mobile controls only on touch devices */
        @media (pointer: coarse) {
            #mobile-controls { display: flex; }
            #nitro-label { content: "NITRO BOOST [TAP ICON]"; }
        }

        /* Effects */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.5;
        }
        
        .crt-glow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 51;
        }

        .sound-control {
            position: absolute;
            bottom: 5px;
            right: 5px;
            color: #555;
            font-size: 9px;
            z-index: 60;
            pointer-events: all;
            cursor: pointer;
        }
        
        /* Stat Bars */
        .stat-row { display: flex; align-items: center; width: 100%; max-width: 200px; font-size: 10px; margin: 2px 0; color: #aaa; }
        .stat-label { width: 40px; text-align: right; margin-right: 10px; }
        .stat-bar-bg { flex: 1; height: 5px; background: #333; }
        .stat-bar-fill { height: 100%; background: var(--neon-blue); width: 0%; transition: width 0.3s; }

        #music-input { display: none; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="800" height="900"></canvas>
        <div class="scanlines"></div>
        <div class="crt-glow"></div>
        <div class="sound-control" onclick="toggleMute()">[MUTE MUSIC]</div>
        
        <div id="hud" style="display: none;">
            <div class="hud-panel">
                <div id="scoreDisplay" style="font-size: 18px; color: #fff;">000000</div>
                <div id="speedDisplay" style="font-size: 10px; color: var(--neon-blue); margin-top: 2px;">SPEED: 120 KM/H</div>
            </div>
            <div class="hud-panel right-panel">
                <div id="levelDisplay" style="font-size: 18px; color: #fff;">LVL 01</div>
                <div id="zoneDisplay" style="font-size: 10px; color: var(--neon-pink); margin-top: 2px;">NEON BAY</div>
            </div>
        </div>
        
        <div id="nitro-container">
            <div id="nitro-label">NITRO BOOST</div>
            <div id="nitro-fill"></div>
        </div>

        <!-- Mobile UI Overlay -->
        <div id="mobile-controls">
            <div style="display: flex; gap: 15px; align-self: flex-end;">
                <div class="touch-btn" id="ctrl-left">←</div>
                <div class="touch-btn" id="ctrl-right">→</div>
            </div>
            <div style="align-self: flex-end;">
                <div class="touch-btn nitro-btn" id="ctrl-up">N</div>
            </div>
        </div>

        <div id="ui-layer">
            <!-- Start Screen -->
            <div id="start-screen">
                <h1>NEON OVERDRIVE V</h1>
                <h2>HYPER SPEED</h2>
                
                <div class="vehicle-grid" id="grid-full"></div>

                <div id="selected-stats" style="margin: 5px 20px; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid #444; display: flex; flex-direction: column; align-items: center;">
                    <div id="sel-name" style="color: var(--neon-blue); font-size: 16px; margin-bottom: 2px; font-weight: bold;">FLUX SEDAN</div>
                    <div id="sel-desc" style="color: #ccc; font-size: 10px; margin-bottom: 8px; font-style: italic;">Standard issue runner.</div>
                    
                    <div class="stat-row"><div class="stat-label">SPD</div><div class="stat-bar-bg"><div class="stat-bar-fill" id="stat-spd"></div></div></div>
                    <div class="stat-row"><div class="stat-label">GRIP</div><div class="stat-bar-bg"><div class="stat-bar-fill" id="stat-grip"></div></div></div>
                    <div class="stat-row"><div class="stat-label">SIZE</div><div class="stat-bar-bg"><div class="stat-bar-fill" id="stat-size"></div></div></div>
                </div>

                <button class="btn" onclick="startGame()">IGNITE ENGINE</button>
                
                <div style="margin-top: 10px;">
                    <input type="file" id="music-input" accept="audio/*" onchange="handleMusicUpload(this)">
                    <button class="btn btn-small" onclick="document.getElementById('music-input').click()">LOAD CUSTOM TRACK</button>
                </div>
                <div id="music-status" style="font-size: 8px; color: #555; margin-top: 5px;">Default: Zen1th - The Return.mp3</div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" style="display:none;">
                <h1 style="font-size: clamp(48px, 10vw, 72px); color: var(--neon-red); -webkit-text-fill-color: var(--neon-red); text-shadow: 0 0 40px var(--neon-red);">CRASHED</h1>
                <p style="color: #fff; font-size: 12px; margin-bottom: 20px;">SYSTEM FAILURE DETECTED</p>
                
                <div style="display:flex; justify-content: center; gap: 30px; margin-bottom: 20px;">
                    <div>
                        <div style="font-size: 9px; color: #aaa;">SCORE</div>
                        <div id="final-score" style="font-size: 24px; color: var(--neon-blue);">0</div>
                    </div>
                    <div>
                        <div style="font-size: 9px; color: #aaa;">LEVEL</div>
                        <div id="final-level" style="font-size: 24px; color: var(--neon-pink);">1</div>
                    </div>
                </div>

                <button class="btn" onclick="resetGame()">MAIN MENU</button>
                <button class="btn" style="margin-top: 10px; border-color: var(--neon-green); color: var(--neon-green);" onclick="quickRetry()">QUICK RETRY</button>
            </div>
        </div>
    </div>

<script>
/**
 * NEON OVERDRIVE V: HYPER SPEED
 * Optimized for Desktop and Mobile
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Audio System ---
let bgMusic = new Audio();
bgMusic.src = "Zen1th - The Return.mp3"; 
bgMusic.loop = true;
bgMusic.volume = 0.4;
let isMuted = false;

function handleMusicUpload(input) {
    const file = input.files[0];
    if (file) {
        const url = URL.createObjectURL(file);
        bgMusic.src = url;
        document.getElementById('music-status').innerText = "Loaded: " + file.name;
        document.getElementById('music-status').style.color = "#0f0";
    }
}

function toggleMute() {
    isMuted = !isMuted;
    bgMusic.muted = isMuted;
    document.querySelector('.sound-control').innerText = isMuted ? "[UNMUTE]" : "[MUTE]";
}

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudioContext() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

const SFX = {
    playTone: (freq, type, duration, vol = 0.1) => {
        initAudioContext();
        if(isMuted) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    },
    crash: () => {
        initAudioContext();
        if(isMuted) return;
        const bufSize = audioCtx.sampleRate * 0.5;
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for(let i=0; i<bufSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buf;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        noise.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    },
    nitro: () => {
        initAudioContext();
        if(isMuted) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }
};

// --- Data ---

const VEHICLES = [
    { id: 0, name: "Flux Sedan", type: 'car', color: '#00f3ff', w: 48, h: 85, speed: 0.8, grip: 0.85, desc: "Balanced all-rounder." },
    { id: 1, name: "Neon Cycle", type: 'bike', color: '#ff00ff', w: 24, h: 70, speed: 1.2, grip: 0.95, desc: "High agility, vulnerable." },
    { id: 2, name: "Titan Hauler", type: 'car', color: '#00ff9d', w: 70, h: 110, speed: 0.5, grip: 0.7, desc: "Heavy tank. Slow response." },
    { id: 3, name: "Viper GT", type: 'car', color: '#ff3333', w: 46, h: 90, speed: 1.1, grip: 0.9, desc: "Interceptor class speed." },
    { id: 4, name: "Ghost Rider", type: 'bike', color: '#ffffff', w: 20, h: 65, speed: 1.4, grip: 0.98, desc: "Maximum risk." },
    { id: 5, name: "Enforcer", type: 'car', color: '#3333ff', w: 60, h: 95, speed: 0.7, grip: 0.95, desc: "Police armored unit." },
    { id: 6, name: "Drift King", type: 'car', color: '#ffee00', w: 50, h: 88, speed: 1.15, grip: 0.4, desc: "Extremely slippery handling." },
    { id: 7, name: "Pixel Moped", type: 'bike', color: '#ffaa00', w: 28, h: 60, speed: 0.9, grip: 1.0, desc: "Tiny but capable." },
    { id: 8, name: "Vector Tank", type: 'car', color: '#550055', w: 80, h: 120, speed: 0.4, grip: 0.8, desc: "Takes up the whole lane." },
    { id: 9, name: "Data Runner", type: 'car', color: '#000000', outline: '#00ff00', w: 42, h: 80, speed: 1.3, grip: 0.92, desc: "Glitch in the system." }
];

const LEVELS = [
    { lvl: 1, name: "NEON BAY", speed: 8, density: 80 },
    { lvl: 2, name: "DATA HIGHWAY", speed: 9, density: 75 },
    { lvl: 3, name: "ACID RAIN", speed: 10, density: 70, rain: true },
    { lvl: 4, name: "THE SPRAWL", speed: 11, density: 65, rain: true },
    { lvl: 5, name: "CYBER SLUMS", speed: 12, density: 60 },
    { lvl: 10, name: "OMEGA POINT", speed: 19, density: 42 },
    { lvl: 15, name: "DEEP WEB", speed: 30, density: 30 },
    { lvl: 20, name: "CYBER HELL", speed: 48, density: 20, rain: true }
];

// --- Game State ---
let state = {
    running: false,
    score: 0,
    levelIndex: 0,
    frame: 0,
    bgOffset: 0,
    shake: 0,
    reqId: 0,
    nitro: 100,
    isBoosting: false
};

let player = {
    vehicleId: 0,
    x: 0, y: 0, vx: 0, maxVx: 0, friction: 0, w: 0, h: 0
};

let input = { left: false, right: false, up: false };
let enemies = [];
let rain = [];

// --- Init ---

function initVehicleSelection() {
    const grid = document.getElementById('grid-full');
    grid.innerHTML = ''; 
    
    VEHICLES.forEach((v, index) => {
        const card = document.createElement('div');
        card.className = 'vehicle-card';
        if (index === 0) card.classList.add('selected');
        
        const c = document.createElement('canvas');
        c.width = 40; c.height = 60;
        const ctxV = c.getContext('2d');
        drawVehicleRender(ctxV, v, 20 - v.w/4, 30 - v.h/4, 0.5, false);
        
        card.appendChild(c);
        const name = document.createElement('div');
        name.className = 'v-name';
        name.innerText = v.name.split(' ')[0]; 
        card.appendChild(name);

        card.onclick = () => selectVehicle(index, card);
        grid.appendChild(card);
    });
    selectVehicle(0, document.querySelector('.vehicle-card'));
}

function selectVehicle(index, cardElement) {
    player.vehicleId = index;
    document.querySelectorAll('.vehicle-card').forEach(c => c.classList.remove('selected'));
    if(cardElement) cardElement.classList.add('selected');
    
    const v = VEHICLES[index];
    document.getElementById('sel-name').innerText = v.name.toUpperCase();
    document.getElementById('sel-name').style.color = v.color;
    document.getElementById('sel-desc').innerText = v.desc;

    document.getElementById('stat-spd').style.width = (v.speed / 1.5 * 100) + '%';
    document.getElementById('stat-grip').style.width = (v.grip * 100) + '%';
    document.getElementById('stat-size').style.width = (v.w / 80 * 100) + '%';
}

function startGame() {
    initAudioContext();
    input = { left: false, right: false, up: false };

    const v = VEHICLES[player.vehicleId];
    player.w = v.w;
    player.h = v.h;
    player.x = canvas.width / 2 - v.w / 2;
    player.y = 700;
    player.vx = 0;
    player.maxVx = 7 * v.speed;
    player.friction = 0.88 * (2 - v.grip);

    state.running = true;
    state.score = 0;
    state.levelIndex = 0;
    state.frame = 0;
    state.shake = 0;
    state.nitro = 100;
    state.isBoosting = false;
    enemies = [];
    rain = [];
    
    document.getElementById('ui-layer').classList.add('hidden');
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('nitro-container').style.display = 'block';
    
    bgMusic.currentTime = 0;
    bgMusic.play().catch(() => {});

    if (state.reqId) cancelAnimationFrame(state.reqId);
    gameLoop();
}

function quickRetry() {
    startGame();
}

function resetGame() {
    state.running = false;
    if (state.reqId) cancelAnimationFrame(state.reqId);
    
    document.getElementById('game-over-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('nitro-container').style.display = 'none';
    
    document.getElementById('start-screen').style.display = 'block';
    document.getElementById('ui-layer').classList.remove('hidden');
    
    try { bgMusic.pause(); } catch (e) {}
}

// --- Input Handling ---
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w') input.up = true;
});
window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w') input.up = false;
});

// Touch controls for mobile
const touchLeft = document.getElementById('ctrl-left');
const touchRight = document.getElementById('ctrl-right');
const touchUp = document.getElementById('ctrl-up');

const bindTouch = (el, key) => {
    el.addEventListener('touchstart', (e) => { e.preventDefault(); input[key] = true; }, {passive: false});
    el.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = false; }, {passive: false});
    el.addEventListener('touchcancel', (e) => { e.preventDefault(); input[key] = false; }, {passive: false});
};

bindTouch(touchLeft, 'left');
bindTouch(touchRight, 'right');
bindTouch(touchUp, 'up');

// --- Logic ---

function spawnEnemy() {
    const lvl = LEVELS[state.levelIndex];
    const typeIdx = Math.floor(Math.random() * VEHICLES.length);
    const v = VEHICLES[typeIdx];
    const x = Math.random() * (canvas.width - v.w - 40) + 20;
    
    enemies.push({
        x: x,
        y: -150,
        type: v,
        speedOffset: (Math.random() * 2 - 0.5)
    });
}

function gameLoop() {
    if (!state.running) return;

    const lvl = LEVELS[state.levelIndex] || LEVELS[LEVELS.length-1];
    state.frame++;
    
    state.isBoosting = false;
    let currentSpeed = lvl.speed;
    let scoreMulti = 1;

    if (input.up && state.nitro > 0) {
        state.isBoosting = true;
        state.nitro -= 0.5; 
        currentSpeed *= 1.5; 
        scoreMulti = 2; 
        if(state.frame % 5 === 0) SFX.nitro(); 
        if(Math.random() > 0.5) state.shake = 2; 
    } else {
        if (state.nitro < 100) state.nitro += 0.1; 
    }
    document.getElementById('nitro-fill').style.width = state.nitro + '%';

    state.score += scoreMulti;
    
    if(state.shake > 0) state.shake *= 0.9;
    if(state.shake < 0.5) state.shake = 0;

    if (state.score > (state.levelIndex + 1) * 2000 && state.levelIndex < LEVELS.length - 1) {
        state.levelIndex++;
        SFX.playTone(880, 'triangle', 0.5);
    }

    if (input.left) player.vx -= 0.9;
    if (input.right) player.vx += 0.9;
    
    player.vx *= 0.92; 
    if (Math.abs(player.vx) > player.maxVx) player.vx = Math.sign(player.vx) * player.maxVx;

    player.x += player.vx;
    
    if (player.x < 15) { player.x = 15; player.vx *= -0.5; }
    if (player.x + player.w > canvas.width - 15) { player.x = canvas.width - 15 - player.w; player.vx *= -0.5; }

    state.bgOffset += currentSpeed;
    
    let adjustedDensity = Math.max(10, Math.floor(lvl.density * (20 / currentSpeed)));
    if (state.frame % adjustedDensity === 0) spawnEnemy();

    for (let i = 0; i < enemies.length; i++) {
        let e = enemies[i];
        let relativeMove = currentSpeed - (lvl.speed * 0.7);
        e.y += relativeMove + e.speedOffset;
        
        if (
            player.x < e.x + e.type.w &&
            player.x + player.w > e.x &&
            player.y < e.y + e.type.h &&
            player.y + player.h > e.y
        ) {
            gameOver();
            return;
        }
        
        if (e.y > canvas.height) {
            enemies.splice(i, 1);
            i--;
        }
    }
    
    if (lvl.rain) {
        for(let i=0; i<3; i++) {
            rain.push({
                x: Math.random() * canvas.width,
                y: -20,
                l: Math.random() * 20 + 10,
                v: Math.random() * 5 + 15 + currentSpeed
            });
        }
    }
    for(let i=0; i<rain.length; i++) {
        let r = rain[i];
        r.y += r.v;
        if(r.y > canvas.height) {
            rain.splice(i,1); i--;
        }
    }

    document.getElementById('scoreDisplay').innerText = state.score.toString().padStart(6, '0');
    document.getElementById('levelDisplay').innerText = 'LVL ' + String(lvl.lvl).padStart(2, '0');
    document.getElementById('zoneDisplay').innerText = lvl.name;
    let displaySpeed = Math.round(120 + currentSpeed*5);
    document.getElementById('speedDisplay').innerText = 'SPEED: ' + displaySpeed + ' KM/H';

    draw();
    state.reqId = requestAnimationFrame(gameLoop);
}

function gameOver() {
    state.running = false;
    cancelAnimationFrame(state.reqId);
    state.shake = 20; 
    draw(); 
    SFX.crash();
    bgMusic.pause();
    
    document.getElementById('hud').style.display = 'none';
    document.getElementById('nitro-container').style.display = 'none';
    
    const ui = document.getElementById('ui-layer');
    ui.classList.remove('hidden');
    
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'block';
    
    document.getElementById('final-score').innerText = state.score;
    document.getElementById('final-level').innerText = state.levelIndex + 1;
}

// --- Rendering ---

function drawVehicleRender(ctx, vType, x, y, scale=1, isBoosting=false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    
    const w = vType.w;
    const h = vType.h;
    const c = vType.color;
    
    if (isBoosting) {
        ctx.shadowBlur = 40;
        ctx.shadowColor = '#00ffff';
        ctx.globalCompositeOperation = 'lighter';
        const grad = ctx.createLinearGradient(0, h, 0, h+80);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(0.5, '#00f3ff');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(w/2 - 6, h);
        ctx.lineTo(w/2 + 6, h);
        ctx.lineTo(w/2, h + 80 + Math.random()*30);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
    }
    
    ctx.shadowBlur = 25;
    ctx.shadowColor = c;
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-2, 12, 8, 16); // FL
    ctx.fillRect(w-6, 12, 8, 16); // FR
    ctx.fillRect(-2, h-26, 8, 16); // RL
    ctx.fillRect(w-6, h-26, 8, 16); // RR
    
    const bodyGrad = ctx.createLinearGradient(0, 0, 0, h);
    bodyGrad.addColorStop(0, shadeColor(c, 40));
    bodyGrad.addColorStop(0.5, c);
    bodyGrad.addColorStop(1, shadeColor(c, -20));
    ctx.fillStyle = bodyGrad;

    if (vType.type === 'bike') {
        ctx.beginPath();
        ctx.moveTo(w/2, 0);
        ctx.lineTo(w, 18);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.lineTo(0, 18);
        ctx.fill();
    } else {
        ctx.beginPath();
        ctx.moveTo(4, 0);
        ctx.lineTo(w-4, 0);
        ctx.lineTo(w-2, h);
        ctx.lineTo(2, h);
        ctx.fill();
    }
    
    ctx.fillStyle = '#111';
    ctx.fillRect(w/2 - 6, h - 25, 12, 15);
    ctx.fillStyle = isBoosting ? '#fff' : '#00ffff';
    ctx.fillRect(w/2 - 3, h - 22, 6, 10);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(6, h*0.2, w-12, h*0.18); 

    ctx.shadowBlur = 15;
    ctx.shadowColor = '#fff';
    ctx.fillStyle = '#ffffcc';
    ctx.fillRect(4, 1, 5, 6);
    ctx.fillRect(w-9, 1, 5, 6);
    
    ctx.fillStyle = '#ff0000';
    ctx.shadowColor = '#ff0000';
    ctx.fillRect(5, h-6, 6, 6);
    ctx.fillRect(w-11, h-6, 6, 6);

    ctx.restore();
}

function shadeColor(color, percent) {
    let R = parseInt(color.substring(1,3),16);
    let G = parseInt(color.substring(3,5),16);
    let B = parseInt(color.substring(5,7),16);
    R = Math.min(255, Math.round(R * (100 + percent) / 100));
    G = Math.min(255, Math.round(G * (100 + percent) / 100));
    B = Math.min(255, Math.round(B * (100 + percent) / 100));
    let RR = (R.toString(16).length==1?"0"+R.toString(16):R.toString(16));
    let GG = (G.toString(16).length==1?"0"+G.toString(16):G.toString(16));
    let BB = (B.toString(16).length==1?"0"+B.toString(16):B.toString(16));
    return "#"+RR+GG+BB;
}

function draw() {
    let dx = (Math.random() - 0.5) * state.shake;
    let dy = (Math.random() - 0.5) * state.shake;
    
    ctx.save();
    ctx.translate(dx, dy);

    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.lineWidth = 2;
    ctx.strokeStyle = state.isBoosting ? 'rgba(0, 243, 255, 0.4)' : 'rgba(0, 243, 255, 0.15)';
    
    ctx.beginPath();
    for(let x=0; x<=canvas.width; x+=100) {
        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
    }
    let offset = state.bgOffset % 60;
    for(let y=offset; y<=canvas.height; y+=60) {
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();

    ctx.fillStyle = `hsl(${state.frame % 360}, 100%, 50%)`;
    ctx.fillRect(0, 0, 15, canvas.height);
    ctx.fillRect(canvas.width-15, 0, 15, canvas.height);

    enemies.forEach(e => drawVehicleRender(ctx, e.type, e.x, e.y));

    const pType = VEHICLES[player.vehicleId];
    drawVehicleRender(ctx, pType, player.x, player.y, 1, state.isBoosting);
    
    if (rain.length > 0) {
        ctx.strokeStyle = 'rgba(0, 255, 200, 0.3)';
        ctx.lineWidth = 1; ctx.beginPath();
        rain.forEach(r => { ctx.moveTo(r.x, r.y); ctx.lineTo(r.x, r.y + r.l); });
        ctx.stroke();
    }
    
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 300, canvas.width/2, canvas.height/2, 800);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(1, 'rgba(0,0,0,0.8)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,canvas.width, canvas.height);

    ctx.restore();
}

window.onload = () => {
    initVehicleSelection();
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width, canvas.height);
};
